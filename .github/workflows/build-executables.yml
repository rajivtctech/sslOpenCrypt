name: Build Executables

# Triggers:
#   - Push a version tag:  git tag v1.1.0 && git push origin v1.1.0
#   - Manual run from the GitHub Actions tab (workflow_dispatch)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Opt into Node.js 24 now to silence the Node.js 20 deprecation warnings
# from actions/checkout, actions/setup-python, actions/cache.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # OpenSSL bundled into the Windows build. Pinned so the shipped binary is
  # reproducible and its recorded SHA-256 is meaningful. Must stay on 3.x.
  OPENSSL_VERSION: '3.5.4'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset_name: sslOpenCrypt-Linux.AppImage
            platform_label: Linux (x86_64 — AppImage)

          # macos-13 (Intel x86_64) has been retired by GitHub — using macos-14
          # (Apple Silicon arm64) as the sole macOS target. Intel Mac users can
          # run this via Rosetta 2.
          - os: macos-14
            asset_name: sslOpenCrypt-macOS
            platform_label: macOS (arm64 / Apple Silicon)

          - os: windows-latest
            asset_name: sslOpenCrypt-Windows.exe
            platform_label: Windows (x86_64)

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cache pip packages across runs — saves ~60s per build on warm cache
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('sslopencrypt/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Qt6 on Linux requires xcb and EGL platform plugins at build time.
      # libfuse2 is required by appimagetool to build the AppImage.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libegl1 \
            libgl1 \
            upx-ucl \
            libfuse2

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: choco install upx --yes --no-progress

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r sslopencrypt/requirements.txt
          pip install pyinstaller

      # python-pkcs11 needs a C compiler on some platforms.
      # It is optional — the app degrades gracefully without it.
      - name: Install python-pkcs11 (optional)
        run: pip install python-pkcs11 || echo "python-pkcs11 not available on this platform — PKCS#11 hardware token support will be disabled in this build"
        shell: bash

      - name: Show build environment
        run: |
          python --version
          pip show pyinstaller pyhanko cryptography argon2-cffi PyQt6 | grep -E "^(Name|Version)"
        shell: bash

      # -------------------------------------------------------------------
      # Windows ships its own OpenSSL. Installing OpenSSL on Windows by hand
      # is the single worst part of the first-run experience, so the binary
      # and its DLLs are staged here and bundled by PyInstaller.
      #
      # OpenSSL 3.x is Apache-2.0 — compatible with sslOpenCrypt's GPL v3 —
      # and is invoked as a separate process, so this is mere aggregation.
      # Pin 3.x deliberately: OpenSSL 1.x used the old SSLeay licence, which
      # is NOT GPL-compatible and must never be bundled here.
      # -------------------------------------------------------------------
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: choco install openssl --version=${{ env.OPENSSL_VERSION }} --yes --no-progress

      - name: Stage bundled OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = "sslopencrypt/packaging/openssl-win64"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $bin = "C:/Program Files/OpenSSL-Win64/bin"
          if (!(Test-Path "$bin/openssl.exe")) { Write-Error "openssl.exe not found under $bin"; exit 1 }

          Copy-Item "$bin/openssl.exe"            -Destination $dest
          Copy-Item "$bin/libcrypto-3-x64.dll"    -Destination $dest
          Copy-Item "$bin/libssl-3-x64.dll"       -Destination $dest

          # legacy.dll carries single-DES, RC2, RC4, Blowfish, CAST and MD4.
          # Shipped so those remain reachable via -provider legacy; nothing
          # activates it by default, matching Linux/macOS behaviour.
          if (Test-Path "$bin/legacy.dll") { Copy-Item "$bin/legacy.dll" -Destination $dest }

          # Apache-2.0 requires the licence text to travel with the binaries.
          $lic = "C:/Program Files/OpenSSL-Win64/LICENSE.txt"
          if (Test-Path $lic) { Copy-Item $lic -Destination "$dest/OPENSSL-LICENSE.txt" }

          # Record SHA-256 of every staged file. core/executor.py re-checks
          # these at runtime and refuses to run openssl on a mismatch.
          $manifest = @{}
          Get-ChildItem $dest -File | ForEach-Object {
            $manifest[$_.Name] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
          }
          $manifest | ConvertTo-Json | Set-Content "$dest/openssl_manifest.json" -Encoding utf8

          Get-Content "$dest/openssl_manifest.json"
          Get-ChildItem $dest | Format-Table Name, Length

      # Linux: build_appimage.sh runs PyInstaller (onedir) then wraps the
      # output into a self-contained AppImage using appimagetool.
      # macOS / Windows: standard PyInstaller onefile build.
      - name: Build executable (Linux — AppImage)
        if: runner.os == 'Linux'
        working-directory: sslopencrypt
        run: bash packaging/build_appimage.sh

      - name: Build executable (macOS / Windows)
        if: runner.os != 'Linux'
        working-directory: sslopencrypt
        run: >
          pyinstaller packaging/sslopencrypt.spec
          --distpath dist/
          --workpath build/
          --noconfirm

      # macOS: rename the Mach-O binary to the matrix asset_name.
      - name: Rename binary to asset name (macOS)
        if: runner.os == 'macOS'
        working-directory: sslopencrypt/dist
        run: |
          ls -lh
          BUILT=$(find . -maxdepth 1 -type f -not -name "*.pkg" | head -1 | sed 's|^\./||')
          echo "Built file: $BUILT"
          if [ "$BUILT" != "${{ matrix.asset_name }}" ]; then
            mv "$BUILT" "${{ matrix.asset_name }}"
            echo "Renamed $BUILT → ${{ matrix.asset_name }}"
          fi
          ls -lh
          echo "Binary size: $(du -sh ${{ matrix.asset_name }} | cut -f1)"

      - name: Verify build output (Windows)
        if: runner.os == 'Windows'
        working-directory: sslopencrypt/dist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dir
          if (!(Test-Path "${{ matrix.asset_name }}")) { Write-Error "ERROR: expected binary not found"; exit 1 }
          $size = (Get-Item "${{ matrix.asset_name }}").length / 1MB
          Write-Host ("Binary size: {0:N1} MB" -f $size)

      # The runners already have openssl on PATH (Git for Windows, Strawberry
      # Perl), so "an openssl command worked" proves nothing about the bundle.
      # PATH is stripped to the bare system directories first: if the bundled
      # copy were missing, resolution now has nothing to fall back to.
      - name: Verify bundled OpenSSL (Windows)
        if: runner.os == 'Windows'
        working-directory: sslopencrypt/dist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "C:\Windows\system32;C:\Windows"
          if (Get-Command openssl -ErrorAction SilentlyContinue) {
            Write-Error "PATH scrub failed — openssl is still reachable, the test would be meaningless"
            exit 1
          }

          # stdout only. Merging stderr in would let any bootloader or Qt
          # warning turn a good build into a JSON parse error.
          $raw = & "./${{ matrix.asset_name }}" --cli --mode version --pretty | Out-String
          Write-Host $raw
          $info = $raw | ConvertFrom-Json

          if (-not $info.success)        { Write-Error "openssl did not resolve inside the bundle: $($info.error)"; exit 1 }
          if (-not $info.openssl_bundled){ Write-Error "resolved openssl is NOT the bundled one: $($info.openssl_path)"; exit 1 }
          if ($info.version -notmatch '^OpenSSL 3\.') { Write-Error "expected OpenSSL 3.x, got: $($info.version)"; exit 1 }

          Write-Host "OK — bundled $($info.version) at $($info.openssl_path)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          # Linux AppImage lands in dist/; macOS/Windows also land in dist/
          path: sslopencrypt/dist/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 30

  release:
    # Only publish a release when triggered by a version tag push
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh artifacts/

      - name: Make Linux / macOS executables runnable
        run: |
          chmod +x artifacts/sslOpenCrypt-Linux.AppImage || true
          chmod +x artifacts/sslOpenCrypt-macOS          || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: sslOpenCrypt ${{ github.ref_name }}
          body: |
            ## sslOpenCrypt ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Notes |
            |---|---|---|
            | Linux x86_64 | `sslOpenCrypt-Linux.AppImage` | Ubuntu 22.04+, Debian 12+, Fedora 38+. AppImage — no installation required. |
            | macOS (Apple Silicon) | `sslOpenCrypt-macOS` | macOS 14+ native arm64; also runs on Intel Mac via Rosetta 2 |
            | Windows x86_64 | `sslOpenCrypt-Windows.exe` | Windows 10 / 11 |

            ### Running from a USB pendrive

            All binaries are self-contained — no installation required on any platform.

            **Linux (AppImage):**
            ```bash
            chmod +x sslOpenCrypt-Linux.AppImage
            ./sslOpenCrypt-Linux.AppImage
            ```
            The AppImage mounts itself via FUSE and runs in-place. No extraction to `/tmp`.

            **macOS:**
            ```bash
            chmod +x sslOpenCrypt-macOS
            # First run: right-click → Open (to bypass Gatekeeper on unsigned binary)
            ./sslOpenCrypt-macOS
            ```

            **Windows:** Double-click `sslOpenCrypt-Windows.exe`. Windows SmartScreen may warn on first run — click **More info → Run anyway**.

            ### System requirements

            **Windows needs nothing installed.** OpenSSL 3.x ships inside
            `sslOpenCrypt-Windows.exe`; the app uses its own copy in preference to
            anything on `PATH`, and checks its SHA-256 before running it.

            | OS | OpenSSL | GnuPG (optional) |
            |---|---|---|
            | Windows | bundled — nothing to install | [Gpg4win](https://gpg4win.org) |
            | Ubuntu / Debian | `sudo apt install openssl` | `sudo apt install gnupg` |
            | macOS | preinstalled, or `brew install openssl` | `brew install gnupg` |

            GnuPG is not bundled on any platform — the GPG panel is disabled when it is absent
            and everything else works normally.

            To confirm which OpenSSL is in use:
            ```
            sslOpenCrypt-Windows.exe --cli --mode version --pretty
            ```

            > Bundled OpenSSL is © The OpenSSL Project, licensed Apache-2.0; the licence text
            > travels inside the executable. sslOpenCrypt itself remains GPL v3.

            > **India DSC note:** On-token PKCS#11 signing and PAdES PDF signing require the vendor USB token driver (libcastle.so / libeToken.so on Linux, equivalent on macOS/Windows). These are not bundled and must be installed separately from the token manufacturer.
          files: |
            artifacts/sslOpenCrypt-Linux.AppImage
            artifacts/sslOpenCrypt-macOS
            artifacts/sslOpenCrypt-Windows.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
